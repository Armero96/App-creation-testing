<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Makes the page fit the phone's width instead of a zoomed-out desktop view -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jobits</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- The "viewport" is the window you look through; it shows one screen at a time. -->
  <main class="viewport">
    <!-- The "track" holds both screens side by side. We slide it left/right to switch. -->
    <div class="track" id="track">

      <!-- ===== Screen 1: Main (today) ===== -->
      <section class="screen" id="screen-main" aria-label="Today">
        <div class="ascension">Ascension: 0</div>

        <!-- Placeholder for the adventurer: just shows the current sword -->
        <div class="adventurer">
          <p>Wooden sword</p>
        </div>

        <!-- Day progress bar (empty for now; filled in a later step) -->
        <div class="progress">
          <div class="progress-fill" style="width: 0%"></div>
        </div>
        <p class="progress-label">0 / 0 exp</p>

        <h2>Today's tasks</h2>
        <p class="placeholder">No tasks yet</p>
      </section>

      <!-- ===== Screen 2: Habits ===== -->
      <section class="screen" id="screen-habits" aria-label="Habits">
        <h1>Habits</h1>
        <!-- Shown only when there are no habits saved -->
        <p class="placeholder" id="habits-empty">No habits yet</p>
        <!-- app.js fills this list with one <li> per saved habit -->
        <ul class="habit-list" id="habit-list"></ul>
        <!-- Opens the "new habit" form -->
        <button class="add-button" id="add-button" type="button" aria-label="Add habit">+</button>
      </section>

    </div>
  </main>

  <!-- Screen indicator: one dot per screen, each with a small pixel icon.
       Icons are drawn as tiny SVG squares ("pixels") on an 8x8 grid. -->
  <nav class="indicator" aria-hidden="true">
    <span class="dot" data-screen="0" title="Today">
      <!-- Sword: blade going up-right, crossguard, handle, pommel -->
      <svg viewBox="0 0 8 8" shape-rendering="crispEdges">
        <rect x="7" y="0" width="1" height="1"/>
        <rect x="6" y="1" width="1" height="1"/>
        <rect x="5" y="2" width="1" height="1"/>
        <rect x="4" y="3" width="1" height="1"/>
        <rect x="2" y="3" width="1" height="1"/>
        <rect x="3" y="4" width="1" height="1"/>
        <rect x="4" y="5" width="1" height="1"/>
        <rect x="2" y="5" width="1" height="1"/>
        <rect x="1" y="6" width="1" height="1"/>
        <rect x="0" y="7" width="1" height="1"/>
      </svg>
    </span>
    <span class="dot" data-screen="1" title="Habits">
      <!-- List: three bullet points with lines -->
      <svg viewBox="0 0 8 8" shape-rendering="crispEdges">
        <rect x="0" y="1" width="1" height="1"/><rect x="2" y="1" width="6" height="1"/>
        <rect x="0" y="4" width="1" height="1"/><rect x="2" y="4" width="6" height="1"/>
        <rect x="0" y="7" width="1" height="1"/><rect x="2" y="7" width="6" height="1"/>
      </svg>
    </span>
  </nav>

  <!-- ===== "New habit" popup =====
       It lives outside the sliding track so it always covers the whole window.
       The "hidden" attribute keeps it invisible until app.js removes it. -->
  <div class="modal" id="habit-modal" hidden>
    <form class="habit-form" id="habit-form" novalidate>
      <h2>New habit</h2>

      <label for="habit-name">Name</label>
      <input type="text" id="habit-name" maxlength="40" autocomplete="off">

      <label for="habit-exp">Exp</label>
      <!-- inputmode="numeric" shows a number keypad on phones -->
      <input type="number" id="habit-exp" min="1" step="1" inputmode="numeric">

      <label for="habit-date">Date</label>
      <input type="date" id="habit-date">

      <label for="habit-timing">Time of day</label>
      <select id="habit-timing">
        <option value="anytime">Any time</option>
        <option value="morning">Morning</option>
        <option value="noon">Noon</option>
        <option value="afternoon">Afternoon</option>
        <option value="evening">Evening</option>
      </select>

      <label class="checkbox-row">
        <input type="checkbox" id="habit-repeating">
        Repeating
      </label>

      <!-- Only shown when "Repeating" is ticked -->
      <div id="repeat-options" hidden>
        <label for="habit-repeat">Repeat</label>
        <select id="habit-repeat">
          <option value="daily">Every day</option>
          <option value="workdays">Every work day</option>
          <option value="every2days">Every second day</option>
          <option value="weekly">Every week</option>
          <option value="monthly">Every month</option>
        </select>
      </div>

      <!-- Validation messages appear here -->
      <p class="form-error" id="form-error"></p>

      <div class="form-buttons">
        <button type="button" class="button-secondary" id="cancel-button">Cancel</button>
        <button type="submit" class="button-primary">Save</button>
      </div>
    </form>
  </div>

  <script src="app.js"></script>
</body>
</html>
