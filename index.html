<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jobits</title>
  <!-- Fallback: if JavaScript doesn't run, go to the app after 1 second -->
  <meta http-equiv="refresh" content="1; url=Jobits/">
  <style>
    body { margin: 0; padding: 16px; background: #1d2b53; color: #fff1e8; font-family: monospace; }
    a { color: #ffec27; }
  </style>
</head>
<body>
  <!-- Jobits used to live at this address. This page forwards to its new folder. -->
  <p>Jobits has moved: <a href="Jobits/">open Jobits</a></p>

  <script>
    // Switch off the old service worker that was registered at this address
    // (before Jobits moved into its own folder), so it can't serve outdated
    // copies of the app. Then forward to the new address.
    // location.replace() means the Back button won't return to this page.
    const oldScope = new URL("./", location.href).href;

    async function cleanUpAndForward() {
      try {
        if ("serviceWorker" in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          for (const registration of registrations) {
            if (registration.scope === oldScope) await registration.unregister();
          }
        }
      } catch (error) {
        console.warn("Could not remove the old service worker:", error);
      }
      location.replace("Jobits/");
    }

    cleanUpAndForward();
  </script>
</body>
</html>
